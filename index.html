<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <meta name="description"
    content="Ronald Senokoane is a junior full-stack software engineer in South Africa, building practical web applications with JavaScript, React, Node.js and Firebase.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ronald Senokoane — Junior Full-Stack Software Developer">
  <meta property="og:description"
    content="Practical web development, workplace IT support, and a service mindset shaped by financial services.">
  <meta property="og:image" content="public/og-image.svg">
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem("portfolio-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      } else if (matchMedia("(prefers-color-scheme: light)").matches) {
        document.documentElement.dataset.theme = "light";
      }
    } catch {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <title>Ronald Senokoane — Junior Full-Stack Software Developer</title>
</head>

<body>
  <div id="root"></div>
  <script src="script.js" defer></script>
</body>

</html>
